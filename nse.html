<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifty Stock Index Finder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f9fc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #94a3b8;
    --accent: #d97706;
    --accent2: #0891b2;

    --n50: #b45309;
    --n50-bg: rgba(217,119,6,0.08);
    --nnext: #0e7490;
    --nnext-bg: rgba(8,145,178,0.08);
    --nmid: #7c3aed;
    --nmid-bg: rgba(124,58,237,0.08);
    --nsmall: #059669;
    --nsmall-bg: rgba(5,150,105,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #d97706;
  }

  .logo span { color: var(--text); }

  .stock-count {
    background: var(--border);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* Search */
  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px 13px 44px;
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.3px;
  }

  #searchInput::placeholder { color: var(--muted); }

  #searchInput:focus {
    border-color: #d97706;
    box-shadow: 0 0 0 3px rgba(217,119,6,0.12);
  }

  .clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--border);
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .clear-btn:hover { background: var(--accent); color: #000; }
  .clear-btn.visible { display: flex; }

  /* Filters */
  .filters {
    display: flex;
    gap: 8px;
    padding: 16px 40px 0;
    flex-wrap: wrap;
  }

  .filter-btn {
    border: 1.5px solid var(--border);
    background: transparent;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }

  .filter-btn:hover { border-color: var(--muted); color: var(--text); }

  .filter-btn.active[data-index="all"] { border-color: var(--text); color: var(--text); background: rgba(255,255,255,0.05); }
  .filter-btn.active[data-index="Nifty 50"] { border-color: var(--n50); color: var(--n50); background: var(--n50-bg); }
  .filter-btn.active[data-index="Nifty Next 50"] { border-color: var(--nnext); color: var(--nnext); background: var(--nnext-bg); }
  .filter-btn.active[data-index="Nifty Midcap 150"] { border-color: var(--nmid); color: var(--nmid); background: var(--nmid-bg); }
  .filter-btn.active[data-index="Nifty Smallcap 250"] { border-color: var(--nsmall); color: var(--nsmall); background: var(--nsmall-bg); }

  /* Results bar */
  .results-bar {
    padding: 12px 40px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    border-bottom: 1px solid var(--border);
  }

  .results-bar span { color: #d97706; font-weight: 600; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: #f8fafc;
    padding: 12px 20px;
    text-align: left;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1.2px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }

  thead th:hover { color: var(--text); }
  thead th .sort-icon { margin-left: 5px; opacity: 0.4; }
  thead th.sorted .sort-icon { opacity: 1; color: #d97706; }

  tbody tr {
    border-bottom: 1px solid rgba(30,37,48,0.6);
    transition: background 0.1s;
  }

  tbody tr:hover { background: #f1f5f9; }

  td {
    padding: 13px 20px;
    font-size: 13px;
    vertical-align: middle;
  }

  .col-symbol {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
  }

  .col-company {
    color: #475569;
    font-size: 13px;
    max-width: 320px;
  }

  .col-industry {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .col-isin {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge-n50    { color: var(--n50);    background: var(--n50-bg);    border: 1px solid rgba(245,158,11,0.25); }
  .badge-nnext  { color: var(--nnext);  background: var(--nnext-bg);  border: 1px solid rgba(6,182,212,0.25); }
  .badge-nmid   { color: var(--nmid);   background: var(--nmid-bg);   border: 1px solid rgba(167,139,250,0.25); }
  .badge-nsmall { color: var(--nsmall); background: var(--nsmall-bg); border: 1px solid rgba(52,211,153,0.25); }

  .badge-n50    .badge-dot { background: var(--n50); }
  .badge-nnext  .badge-dot { background: var(--nnext); }
  .badge-nmid   .badge-dot { background: var(--nmid); }
  .badge-nsmall .badge-dot { background: var(--nsmall); }

  /* Highlight match */
  mark {
    background: rgba(217,119,6,0.18);
    color: #92400e;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .empty-sub { font-size: 14px; }

  /* Legend */
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
    padding: 14px 40px;
    border-top: 1px solid var(--border);
    background: #f8fafc;
  }
  .legend-label { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }

  @media (max-width: 700px) {
    .header { padding: 20px 16px 16px; }
    .filters { padding: 12px 16px 0; }
    .results-bar { padding: 10px 16px; }
    td, thead th { padding: 10px 12px; }
    .col-company { max-width: 160px; }
    .legend { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">NIFTY<span>INDEX</span></div>

  </div>
  <div class="search-wrap">

</div>

<div class="filters" id="filters">

    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">🔍</div>
    <div class="empty-title">No stocks found</div>
    <div class="empty-sub">Try a different symbol or company name</div>

</div>

<div class="legend">

  <span class="legend-item"><span class="badge badge-nnext"><span class="badge-dot"></span>Nifty Next 50</span></span>
  <span class="legend-item"><span class="badge badge-nmid"><span class="badge-dot"></span>Nifty Midcap 150</span></span>
  <span class="legend-item"><span class="badge badge-nsmall"><span class="badge-dot"></span>Nifty Smallcap 250</span></span>
</div>

bol":"ZEEL","company":"Zee Entertainment Enterprises Ltd.","industry":"Media Entertainment & Publication","isin":"INE256A01028","index":"Nifty Smallcap 250"},{"symbol":"ZENTEC","company":"Zen Technologies Ltd.","industry":"Capital Goods","isin":"INE251B01027","index":"Nifty Smallcap 250"},{"symbol":"ZENSARTECH","company":"Zensar Technolgies Ltd.","industry":"Information Technology","isin":"INE520A01027","index":"Nifty Smallcap 250"},{"symbol":"ZYDUSWELL","company":"Zydus Wellness Ltd.","industry":"Fast Moving Consumer Goods","isin":"INE768C01028","index":"Nifty Smallcap 250"},{"symbol":"ECLERX","company":"eClerx Services Ltd.","industry":"Services","isin":"INE738I01010","index":"Nifty Smallcap 250"}];

const BADGE_CLASS = {
  'Nifty 50': 'badge-n50',
  'Nifty Next 50': 'badge-nnext',
  'Nifty Midcap 150': 'badge-nmid',
  'Nifty Smallcap 250': 'badge-nsmall'
};

let currentFilter = 'all';
let currentSort = { col: 'symbol', dir: 1 };
let currentQuery = '';

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const tableBody = document.getElementById('tableBody');
const emptyState = document.getElementById('emptyState');
const shownCount = document.getElementById('shownCount');
const resultsBar = document.getElementById('resultsBar');

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, query) {
  if (!query) return esc(text);
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function getBadge(index) {
  return `<span class="badge ${BADGE_CLASS[index]}"><span class="badge-dot"></span>${esc(index)}</span>`;
}

function render() {
  const q = currentQuery.trim().toUpperCase();
  let filtered = STOCKS.filter(s => {
    const matchIndex = currentFilter === 'all' || s.index === currentFilter;
    if (!matchIndex) return false;
    if (!q) return true;
    return s.symbol.toUpperCase().includes(q) ||
           s.company.toUpperCase().includes(q) ||
           s.isin.toUpperCase().includes(q) ||
           s.industry.toUpperCase().includes(q);
  });

  filtered.sort((a, b) => {
    const va = a[currentSort.col].toLowerCase();
    const vb = b[currentSort.col].toLowerCase();
    return va < vb ? -currentSort.dir : va > vb ? currentSort.dir : 0;
  });

  shownCount.textContent = filtered.length;

  if (filtered.length === 0) {
    tableBody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  const rows = filtered.map(s => `
    <tr>
      <td class="col-symbol">${highlight(s.symbol, q)}</td>
      <td class="col-company">${highlight(s.company, q)}</td>
      <td>${getBadge(s.index)}</td>
      <td class="col-industry">${highlight(s.industry, q)}</td>
      <td class="col-isin">${highlight(s.isin, q)}</td>
    </tr>
  `).join('');
  tableBody.innerHTML = rows;
}

// Search
searchInput.addEventListener('input', () => {
  currentQuery = searchInput.value;
  clearBtn.classList.toggle('visible', !!currentQuery);
  render();
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  currentQuery = '';
  clearBtn.classList.remove('visible');
  searchInput.focus();
  render();
});

// Filters
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.index;
  render();
});

// Sort
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (currentSort.col === col) {
      currentSort.dir *= -1;
    } else {
      currentSort = { col, dir: 1 };
    }
    document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.sort-icon').textContent = currentSort.dir === 1 ? '↑' : '↓';
    render();
  });
});

// Init
render();
</script>
